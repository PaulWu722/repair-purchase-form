<script>

const FORMS={
  repair:{kind:'repair',auth:true,name:'修繕器材採購申請單',W:920,H:1301,pw:'210mm',ph:'297mm',page:'A4',title:'subject',titleLabel:'修繕/採購標的',suffix:'修繕申請',

  budget:{kind:'budget',auth:false,name:'預算單',W:2000,H:1414,pw:'297mm',ph:'210mm',page:'A4 landscape',title:'title',titleLabel:'預算單名稱',suffix:' 預算單簽名',
    est:{label:'明細附件（選填）',required:false},stamp:20,

    est:{label:'單據／發票（選填）',required:false},stamp:24,
    first:'handler1', // 發起者只能簽這一格

    slot:{handler1:[524,794,770,877],handler2:[774,794,1021,877],elder:[524,884,1021,967],accounting:[524,974,1021,1057],cashier:[524,1064,1021,1152],area:[1394,794,1861,877],finance:[1394,884,1861,967]},
    hint(f){const n=parseInt(DIG.map((_,i)=>f['a'+i]||'').join(''),10);if(!n)return '';
      return `金額 NT$ ${n.toLocaleString()}：`+(n<=4000?'須區負責簽證':n<=10000?'須長老/負責弟兄簽證':'須財務監督會簽')+'；經手人必須二人以上。'}}
};
let F=FORMS.repair,ROLES=F.roles,SLOT=F.slot;
function setForm(k){
  F=FORMS[k]||FORMS.repair;ROLES=F.roles;SLOT=F.slot;
  let s=document.getElementById('pg');if(!s){s=document.createElement('style');s.id='pg';document.head.append(s)}
  s.textContent=`@page{size:${F.page};margin:0}`;
}
const P=([a,b,c,d])=>`left:${a/F.W*100}%;top:${b/F.H*100}%;width:${(c-a)/F.W*100}%;height:${(d-b)/F.H*100}%`;
const $=s=>document.querySelector(s);
const FN=URL_+'/functions/v1/line-auth';
// LINE 登入後會導回 #st=<token>；token 存在瀏覽器，每次呼叫由資料庫向 LINE 身份對照
let TOKEN=localStorage.getItem('rp_st')||'',ME=null;
if(/^#st=[0-9a-f-]{36}$/.test(location.hash)){TOKEN=location.hash.slice(4);localStorage.setItem('rp_st',TOKEN);history.replaceState(0,'',location.pathname+location.search)}
const login=()=>location.href=FN+'/start?return='+encodeURIComponent(location.origin+location.pathname+location.search);
const logout=()=>{localStorage.removeItem('rp_st');location.reload()};
// 回傳登入狀態；未登入／未綁定時把「登入」或「輸入邀請碼」畫面放進 #app 並回傳 false
async function gate(){
  const w=TOKEN?await rpc('rp_whoami',{p_token:TOKEN}):{state:'none'};
  if(w.state==='ok'){ME=w;return true}
  const home=`<p class="noprint"><a href="./">← 回首頁</a></p>`;
  if(w.state==='unbound'){
    $('#app').innerHTML=home+`<h1>綁定身份</h1><div class="card"><p>已用 LINE 登入（${esc(w.line_name)}）。請輸入管理員給你的<b>邀請碼</b>，把這個 LINE 綁定到你的姓名（只需做一次）。</p>
      <div class="row"><input type="text" id="inv" placeholder="8 碼邀請碼" maxlength="8"><button id="bind">綁定</button></div><div class="msg" id="err"></div>
      <p><a href="#" onclick="logout();return false">換一個 LINE 帳號</a></p></div>`;
    $('#bind').onclick=async()=>{try{await rpc('rp_bind',{p_token:TOKEN,p_invite:$('#inv').value});location.reload()}catch(e){$('#err').textContent=/invalid/.test(e.message)?'邀請碼不正確，或已被使用':/unique|duplicate/.test(e.message)?'這個 LINE 帳號已綁定過':e.message}};
  }else $('#app').innerHTML=home+`<h1>請先登入</h1><div class="card"><p>為了確認簽名者身份，請用 <b>LINE</b> 登入。</p><button id="lg" style="background:#06c755">用 LINE 登入</button></div>`,$('#lg').onclick=login;
  return false;
}
const whoBar=()=>ME?`<p class="noprint foot" style="text-align:right">${esc(ME.name)}　<a href="#" onclick="logout();return false">登出</a></p>`:'';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function rpc(fn,args){
  const r=await fetch(`${URL_}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});
  if(!r.ok){const t=await r.text();throw Error(r.status===409?(/member/.test(t)?'你在這張單已經簽過一個身份了':'這個身份已經簽過名了'):/not assigned|not allowed/.test(t)?'這個身份不是由你簽名':/login required/.test(t)?'登入已過期，請重新用 LINE 登入':t)}
  return r.text().then(t=>t?JSON.parse(t):null);
}
async function upload(blob,ext){
  const p=`${crypto.randomUUID()}.${ext}`;
  const r=await fetch(`${URL_}/storage/v1/object/procurement/${p}`,{method:'POST',headers:{apikey:KEY,'Content-Type':blob.type||'application/octet-stream'},body:blob});
  if(!r.ok)throw Error(await r.text());
  return `${URL_}/storage/v1/object/public/procurement/${p}`;
}
const ext=n=>(n.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'')||'bin';

// 大型程式庫（heic-to 約 3MB）只在真的要轉檔時才載入，簽名人打開頁面不用等
const libs={};
const lib=(u,g)=>window[g]?Promise.resolve():libs[u]||(libs[u]=new Promise((ok,no)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=()=>{delete libs[u];no(Error('轉檔程式庫載入失敗，請檢查網路後重試'))};document.head.append(e)}));
// HEIC/HEIF 瀏覽器讀不了，先轉成 JPEG
async function fromHeic(f){
  if(!/\.(heic|heif)$/i.test(f.name)&&!/hei[cf]/i.test(f.type))return f;
  let b;
  try{await lib('https://cdn.jsdelivr.net/npm/heic-to@1.6.7/dist/iife/heic-to.js','HeicTo');b=await HeicTo({blob:f,type:'image/jpeg',quality:.9})}
  catch(e){ // 程式庫不支援時，改用瀏覽器原生解碼（Safari 可）
    const im=await createImageBitmap(f),c=document.createElement('canvas');c.width=im.width;c.height=im.height;
    c.getContext('2d').drawImage(im,0,0);b=await new Promise(r=>c.toBlob(r,'image/jpeg',.9));
  }
  return new File([b],f.name.replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'});
}
// 把上傳的 PDF 第一頁轉成圖片；圖片原樣回傳
async function toImageBlob(file){
  if(!/pdf$/i.test(file.type)&&!/\.pdf$/i.test(file.name))return file;
  await lib('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','pdfjsLib');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pg=await (await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise).getPage(1);
  const vp=pg.getViewport({scale:2}),c=document.createElement('canvas');
  c.width=vp.width;c.height=vp.height;
  await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  return new Promise(r=>c.toBlob(r,'image/jpeg',.9));
}

// 簽名日期時間，例如 11.18 2123（台北時間）
const stampText=iso=>{const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Taipei',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(iso)).map(x=>[x.type,x.value]));return `${p.month}.${p.day} ${p.hour}${p.minute}`};
let TIMES={};
const sigLayer=(sigs,hl,S=SLOT)=>Object.keys(ROLES).map(r=>{
  if(sigs[r]){
    const [x1,,x2,y2]=S[r],sz=F.stamp,t=TIMES[r]?`<div class="stamp" style="${P([x1,y2-sz*1.6,x2-sz*.3,y2])};font-size:calc(${sz}*var(--u))">${stampText(TIMES[r])}</div>`:'';
    return `<img class="sig" style="${P(S[r])}" src="${esc(sigs[r])}">${t}`}
  return r===hl?`<div class="slot" style="${P(S[r])}">${ROLES[r]}</div>`:''}).join('');
const wrap=(bg,inner)=>`<div class="paper" style="aspect-ratio:${F.W}/${F.H};--u:calc(100cqw/${F.W});--pw:${F.pw};--ph:${F.ph}">${bg?`<img class="bg" src="${esc(bg)}">`:''}${inner}</div>`;
// opts: {edit, bg(url), form, sigs, hl(要顯示虛線框的身份)}
const paper=o=>({repair:repairPaper,huang:huangPaper,budget:budgetPaper}[F.kind])(o||{});
const BCOLS=[['code',170,275,'center'],['date',275,400,'center'],['name',400,860,'left'],['fee',860,1010,'right'],['sub',1010,1160,'right'],['ppl',1160,1280,'center'],['times',1280,1380,'center'],['amt',1380,1540,'right'],['note',1540,1900,'left']];

// 預算單：上傳模式只疊簽名；線上填寫模式整張自己畫（18 列，金額＝召會補助×人數×次數，可手改）

  const svg=`<svg viewBox="0 0 2000 1414" fill="#000"><g fill="none" stroke="#000" stroke-width="3"><rect x="100" y="100" width="1800" height="1210"/>
    <path d="M100 160H1900M100 225H1900M100 285H1900M100 1185H1900M100 1235H1900${rows.map(i=>`M100 ${Y0+(i+1)*RH}H1900`).join('')}M170 225V1185M275 225V1185M400 225V1185M860 225V1185M1010 225V1185M1160 225V1185M1280 225V1185M1380 225V1185M1540 225V1185M420 1235V1310M640 1235V1310M960 1235V1310M1180 1235V1310M1500 1235V1310"/></g>
    ${T(1000,143,'財團法人台灣省台中市召會',34)}${head.map(([t,a,b])=>T((a+b)/2,262,t,24)).join('')}

// 預算單線上填寫：自動算金額與合計，並預設今天日期
function bindBudget(){
  const q=k=>document.querySelector(`[data-k="${k}"]`),n=v=>parseFloat(String(v||'').replace(/,/g,''))||0,f=v=>v.toLocaleString('en-US');
  const tot=()=>{let t=0;for(let i=0;i<BN;i++)t+=n(q(`r${i}_amt`).value);q('total').value=t?f(t):''};
  document.querySelectorAll('.paper [data-k^="r"]').forEach(e=>e.oninput=()=>{
    const m=e.dataset.k.match(/^r(\d+)_(sub|ppl|times)$/);
    if(m){const i=m[1],s=n(q(`r${i}_sub`).value),p=n(q(`r${i}_ppl`).value);if(s&&p)q(`r${i}_amt`).value=f(s*p*(n(q(`r${i}_times`).value)||1))}
    tot()});
  if(!q('dt').value){const d=new Date(),z=x=>String(x).padStart(2,'0');q('dt').value=`${d.getFullYear()}/${z(d.getMonth()+1)}/${z(d.getDate())}`}
  tot();
}

// 簽名板：回傳 ()=>簽名圖(dataURL) 或 null
function sigPad(c,clr){
  const x=c.getContext('2d');let on=false,dirty=false;
  x.lineWidth=5;x.lineCap=x.lineJoin='round';x.strokeStyle='#111';
  const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
  c.onpointerdown=e=>{on=true;dirty=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...pt(e))};
  c.onpointermove=e=>{if(on){x.lineTo(...pt(e));x.stroke()}};
  c.onpointerup=()=>on=false;
  clr.onclick=()=>{x.clearRect(0,0,c.width,c.height);dirty=false};
  return()=>dirty?c.toDataURL('image/png'):null;
}

    <div id="pv"></div>

      ${Object.entries(ROLES).filter(([r])=>r!==F.first).map(([r,n])=>{const c=cand(r),v=asg[r]??(c.length===1?c[0].id:'');return `<div class="row"><span style="min-width:9em">${n}</span><select data-asg="${r}" style="font:inherit;padding:6px;border-radius:10px"><option value="">不指定</option>${c.map(m=>`<option value="${m.id}" ${v===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div>`}).join('')}</div>`:''}

      <div id="el">${estFiles.map(f=>esc(f.name)).join('、')}</div></div>

    $('#m1').onclick=()=>{mode='fill';redraw()};$('#m2').onclick=()=>{mode='upload';redraw()};
    if(mode==='fill'){$('#pv').innerHTML=paper({edit:true,form:saved});if(F.kind==='budget')bindBudget()}

    };
  };

}

  if((pick||role)&&F.auth&&!await gate())return;
  const sg=d.signers||{},as=d.assign||{};
  // 這個人能不能簽這個身份：已有人簽→不能；有指定→只有被指定的人；沒指定→修繕單看名單資格，黃單不限
  const canSign=r=>F.auth?ME&&!d.sigs[r]&&(as[r]?as[r].id===ME.id:(ME.can||[]).includes(r)):!d.sigs[r]; // 只有修繕單驗證身份
  const lk=localStorage.getItem('rp_'+id);
  const myDone=F.auth?(ME&&Object.keys(sg).find(r=>sg[r].id===ME.id)):(ROLES[lk]?lk:null); // 不驗證的表單：用本機瀏覽器記住簽過的身份
  if(myDone&&(pick||role)&&role!==myDone)role=myDone; // 這張單已簽過，就只看自己那一格
  if(pick&&!role){ // 簽名人入口：依 LINE 身份列出能簽的身份
    const opts=Object.keys(ROLES).filter(canSign);
    if(F.auth&&opts.length===1){role=opts[0]}else{
    $('#app').innerHTML=whoBar()+`<h1>${F.name}</h1><div class="card">${F.auth?`<b>${esc(ME.name)}，請選擇要簽的身份</b>（每人在同一張單只能簽一個身份，簽完不能修改）`:'<b>請選擇您的身份</b>（選了之後，簽名完成就不能再簽其他身份）'}
      ${Object.entries(ROLES).map(([r,n])=>canSign(r)?`<button class="card menu" style="width:100%;border:0;font:inherit;font-weight:700" onclick="setRole('${r}')">${n}<small>我要簽</small></button>`:`<div class="card menu off">${n}<small>${d.sigs[r]?'已簽名'+(sg[r]?.name?'：'+esc(sg[r].name):''):as[r]?'指定：'+esc(as[r].name):'無權限'}</small></div>`).join('')}</div>`;
    return}
  }
  const mine=role&&ROLES[role]?role:'',signed=d.sigs[mine],ok=mine&&canSign(mine);
  let h=`<h1>${F.name}</h1>`;
  if(mine)h+=whoBar()+`<div class="card">您是：${ME?`<b>${esc(ME.name)}</b>（${ROLES[mine]}）`:`<b>${ROLES[mine]}</b>`}　${signed?'<span class="ok">✔ 已簽名</span>':ok?'請先看完下方表單與附件，再於最下方簽名。':`<span class="msg">這個身份${as[mine]?'指定給 '+esc(as[mine].name):'你沒有簽名權限'}，無法簽名。</span>`}</div>`;
  else{
    const u=`${location.origin}${location.pathname}?id=${id}&s=1`;
    h+=`<div class="card noprint"><b>簽名人連結</b>（只要傳這一條給所有簽名人；${F.auth?'他們用 LINE 登入，只能簽被指定給自己的身份':'他們進去後自己選身份'}）
    <div class="row"><input type="text" readonly value="${u}"><button class="alt" onclick="navigator.clipboard.writeText('${u}');this.textContent='已複製'">複製</button></div>
    <div class="row">${Object.entries(ROLES).map(([r,n])=>`${n}${as[r]?'（'+esc(as[r].name)+'）':''} ${d.sigs[r]?`<span class="ok">✔ ${esc(sg[r]?.name||'已簽')}</span>`:'<span class="wait">尚未簽</span>'}`).join('　')}</div>
    ${F.hint&&F.hint(d.form)?`<div class="row wait">${F.hint(d.form)}</div>`:''}
    <div class="row"><button onclick="copyAll(this,SUBJ)">一鍵複製 2 組連結</button></div>
    <div class="row"><button onclick="location.reload()" class="alt">重新整理狀態</button><button onclick="print()">列印／存成 PDF</button></div></div>`;
  }
  TIMES=d.times||{};
  h+=paper({bg:d.bg_url||'',form:d.form,sigs:d.sigs,hl:ok?mine:''})+`<div class="noprint">${estimates(d.files)}`;
  if(ok)h+=`<div class="card"><b>簽名</b>（用手指或滑鼠在框內簽名）<canvas id="pad" class="pad" width="900" height="300"></canvas>
    <div class="row"><button class="alt" id="clr">清除</button><button id="sub">確認簽名並送出</button><span class="msg" id="err"></span></div></div>`;
  $('#app').innerHTML=h+'</div>';
  if(ok)pad();
}
function setRole(r){role=r;view()}
function copyAll(b,title){
  const base=`${location.origin}${location.pathname}?id=${id}`;
  navigator.clipboard.writeText(`${title}${F.suffix}\n\n我的連結：\n${base}\n\n簽名人連結${F.auth?'（請用 LINE 登入簽名）':''}：\n${base}&s=1`);
  b.textContent='已複製 ✔';
}
function pad(){
  const get=sigPad($('#pad'),$('#clr'));
  $('#sub').onclick=async()=>{
    const img=get();if(!img){$('#err').textContent='請先簽名';return}
    $('#sub').disabled=true;
    try{await rpc('rp_sign',{p_id:id,p_role:role,p_img:img,p_token:TOKEN||null});if(!F.auth)localStorage.setItem('rp_'+id,role);view()}
    catch(e){$('#err').textContent=e.message;$('#sub').disabled=false}
  };
}

let q=new URLSearchParams(location.search),id=q.get('id'),role=q.get('r'),pick=q.get('s');
if(id)view();else if(q.get('admin'))admin();else if(FORMS[q.get('f')]){setForm(q.get('f'));create()}else menu();
</script>
</body>
</html>
