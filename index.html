// HEIC/HEIF 瀏覽器讀不了，先轉成 JPEG
async function fromHeic(f){
  if(!/\.(heic|heif)$/i.test(f.name)&&!/hei[cf]/i.test(f.type))return f;
  let b;
  try{b=await HeicTo({blob:f,type:'image/jpeg',quality:.9})}
  catch(e){ // 程式庫不支援時，改用瀏覽器原生解碼（Safari 可）
    const im=await createImageBitmap(f),c=document.createElement('canvas');c.width=im.width;c.height=im.height;
    c.getContext('2d').drawImage(im,0,0);b=await new Promise(r=>c.toBlob(r,'image/jpeg',.9));
  }
  return new File([b],f.name.replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'});
}
// 把上傳的 PDF 第一頁轉成圖片；圖片原樣回傳
async function toImageBlob(file){
  if(!/pdf$/i.test(file.type)&&!/\.pdf$/i.test(file.name))return file;
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pg=await (await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise).getPage(1);
  const vp=pg.getViewport({scale:2}),c=document.createElement('canvas');
  c.width=vp.width;c.height=vp.height;
  await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
  return new Promise(r=>c.toBlob(r,'image/jpeg',.9));
}

// 簽名板：回傳 ()=>簽名圖(dataURL) 或 null
function sigPad(c,clr){
  const x=c.getContext('2d');let on=false,dirty=false;
  x.lineWidth=5;x.lineCap=x.lineJoin='round';x.strokeStyle='#111';
  const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
  c.onpointerdown=e=>{on=true;dirty=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...pt(e))};
  c.onpointermove=e=>{if(on){x.lineTo(...pt(e));x.stroke()}};
  c.onpointerup=()=>on=false;
  clr.onclick=()=>{x.clearRect(0,0,c.width,c.height);dirty=false};
  return()=>dirty?c.toDataURL('image/png'):null;
}

      ${mode==='upload'?`<div class="row">表單（PDF 或圖片，第一頁）：<input type="file" id="bg" accept="application/pdf,image/*"></div>
        <div class="row">${F.titleLabel}（做為連結標題）：<input type="text" data-k="${F.title}" id="subj" value="${esc(subj)}"></div>`:''}
      ${mode==='fill'||bgFile?'':'<p>請選擇檔案</p>'}</div>
    <div id="pv"></div>
    ${F.first?`<div class="card"><b>${ROLES[F.first]}簽名</b>（發起者只能簽這一格，其他欄位由簽名人連結簽）<canvas id="pad1" class="pad" width="900" height="300"></canvas>
      <div class="row"><button class="alt" id="clr1">清除</button></div></div>`:''}
    <div class="card"><div class="row">${F.est.label}（PDF 或圖片，可多選）：<input type="file" id="est" accept="application/pdf,image/*" multiple></div>
      <div id="el">${estFiles.map(f=>esc(f.name)).join('、')}</div></div>
    <div class="card"><button id="go">建立並產生簽名連結</button> <span class="msg" id="err"></span></div>`;
    $('#m1').onclick=()=>{mode='fill';draw()};$('#m2').onclick=()=>{mode='upload';draw()};
    if(mode==='fill')$('#pv').innerHTML=paper({edit:true});
    if(mode==='upload'&&bgFile)$('#pv').innerHTML=paper({edit:true,bg:window.URL.createObjectURL(bgFile.prev)});
    if(F.first)getSig=sigPad($('#pad1'),$('#clr1'));
    if($('#subj'))$('#subj').oninput=e=>subj=e.target.value;
    if($('#bg'))$('#bg').onchange=async e=>{if(!e.target.files[0])return;$('#err').textContent='處理中…';
      try{const f=await fromHeic(e.target.files[0]);bgFile={src:f,prev:await toImageBlob(f)};$('#err').textContent='';draw()}catch(x){$('#err').textContent=x.message}};
    $('#est').onchange=e=>{estFiles=[...estFiles,...e.target.files];$('#el').textContent=estFiles.map(f=>f.name).join('、')};
    $('#go').onclick=async()=>{
      const b=$('#go');b.disabled=true;$('#err').textContent='上傳中…';
      try{
        if(mode==='upload'&&!bgFile)throw Error('請先上傳表單');
        const form=collect();
        if(F.kind==='huang'){
          if(mode==='fill'){
            const miss=['no','dy','dm','dd','dq','xq','purpose','desc'].filter(k=>!(form[k]||'').trim());
            if(miss.length||!DIG.some((_,i)=>(form['a'+i]||'').trim()))throw Error('黃單所有欄位都要填寫（單號、日期、大區、小區、用途、說明、金額）');
          }else if(!(form.purpose||'').trim())throw Error('請填寫「用途」（做為連結標題）');
          if(!getSig())throw Error('請先在「經手人（一）」簽名');
        }
        if(F.est.required&&!estFiles.length)throw Error('請至少上傳一份'+F.est.label);
        const bgUrl=mode==='upload'?await upload(bgFile.prev,bgFile.prev.type==='image/jpeg'?'jpg':ext(bgFile.src.name)):null;
        const files=[];for(const o of estFiles){const f=await fromHeic(o);files.push({name:f.name,url:await upload(f,ext(f.name))})}
        const id=await rpc('rp_create',{p_form:form,p_bg:bgUrl,p_files:files});
        if(F.first)await rpc('rp_sign',{p_id:id,p_role:F.first,p_img:getSig()});
        location.search='?id='+id;
      }catch(x){$('#err').textContent=x.message;b.disabled=false}
    };
  };
  draw();
}

/* ---------- 檢視／簽名頁 ---------- */
async function view(){
  const d=await rpc('rp_get',{p_id:id});
  if(!d){$('#app').innerHTML='<p class="msg">找不到這份申請單</p>';return}
  setForm(d.form._kind);
  window.SUBJ=(d.form[F.title]||'').trim();
  const lock=localStorage.getItem('rp_'+id); // 這個瀏覽器簽過就鎖定該身份
  if(lock&&ROLES[lock]&&(pick||role))role=lock; // 總覽連結不受鎖定影響
  if(pick&&!role){ // 簽名人入口：先選身份
    $('#app').innerHTML=`<h1>${F.name}</h1><div class="card"><b>請選擇您的身份</b>（選了之後，簽名完成就不能再簽其他身份）
      ${Object.entries(ROLES).map(([r,n])=>d.sigs[r]?`<div class="card menu off">${n}<small>已簽名</small></div>`:`<button class="card menu" style="width:100%;border:0;font:inherit;font-weight:700" onclick="setRole('${r}')">${n}<small>我是${n}</small></button>`).join('')}</div>`;
    return;
  }
  const mine=role&&ROLES[role]?role:'',signed=d.sigs[mine];
  let h=`<h1>${F.name}</h1>`;
  if(mine)h+=`<div class="card">您是：<b>${ROLES[mine]}</b>　${signed?'<span class="ok">✔ 已簽名</span>':'請先看完下方表單與附件，再於最下方簽名。'}</div>`;
  else{
    const u=`${location.origin}${location.pathname}?id=${id}&s=1`;
    h+=`<div class="card noprint"><b>簽名人連結</b>（只要傳這一條給所有簽名人，他們進去後自己選身份）
    <div class="row"><input type="text" readonly value="${u}"><button class="alt" onclick="navigator.clipboard.writeText('${u}');this.textContent='已複製'">複製</button></div>
    <div class="row">${Object.entries(ROLES).map(([r,n])=>`${n} ${d.sigs[r]?'<span class="ok">✔ 已簽</span>':'<span class="wait">尚未簽</span>'}`).join('　')}</div>
    ${F.hint&&F.hint(d.form)?`<div class="row wait">${F.hint(d.form)}</div>`:''}
    <div class="row"><button onclick="copyAll(this,SUBJ)">一鍵複製 2 組連結</button></div>
    <div class="row"><button onclick="location.reload()" class="alt">重新整理狀態</button><button onclick="print()">列印／存成 PDF</button></div></div>`;
  }
  h+=paper({bg:d.bg_url||'',form:d.form,sigs:d.sigs,hl:mine&&!signed?mine:''})+`<div class="noprint">${estimates(d.files)}`;
  if(mine&&!signed)h+=`<div class="card"><b>簽名</b>（用手指或滑鼠在框內簽名）<canvas id="pad" class="pad" width="900" height="300"></canvas>
    <div class="row"><button class="alt" id="clr">清除</button><button id="sub">確認簽名並送出</button><span class="msg" id="err"></span></div></div>`;
  $('#app').innerHTML=h+'</div>';
  if(mine&&!signed)pad();
}
function setRole(r){role=r;view()}
function copyAll(b,title){
  const base=`${location.origin}${location.pathname}?id=${id}`;
  navigator.clipboard.writeText(`${title}${F.suffix}\n我的連結${base}\n簽名人連結${base}&s=1`);
  b.textContent='已複製 ✔';
}
function pad(){
  const get=sigPad($('#pad'),$('#clr'));
  $('#sub').onclick=async()=>{
    const img=get();if(!img){$('#err').textContent='請先簽名';return}
    $('#sub').disabled=true;
    try{await rpc('rp_sign',{p_id:id,p_role:role,p_img:img});localStorage.setItem('rp_'+id,role);view()}
    catch(e){$('#err').textContent=e.message;$('#sub').disabled=false}
  };
}

let q=new URLSearchParams(location.search),id=q.get('id'),role=q.get('r'),pick=q.get('s');
if(id)view();else if(FORMS[q.get('f')]){setForm(q.get('f'));create()}else menu();
</script>
</body>
